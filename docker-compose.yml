services:
  hardware:
    build:
      context: .
      dockerfile: apps/hardware-services/dockerfile
    container_name: buddy-hardware
    ports:
      - "${HARDWARE_PORT}:${HARDWARE_CONTAINER_PORT}"
    volumes:
      - ./apps/hardware-services:/app
    command: python main.py

  mobile:
    build:
      context: ./apps/mobile-app
      dockerfile: dockerfile.dev
    container_name: buddy-mobile
    volumes:
      - ./apps/mobile-app:/app
      - ~/.gradle:/root/.gradle
      - ~/.android:/root/.android
      # Mount Android SDK
      - ${ANDROID_HOME:-$HOME/Android/Sdk}:/usr/local/android-sdk
      # iOS development volumes
      - ${HOME}/Library/Developer/Xcode:/Xcode
      - ${HOME}/Library/Developer/Xcode/DerivedData:/DerivedData
      - ${HOME}/Library/Caches/CocoaPods:/CocoaPods
      - ${HOME}/Library/Developer/Xcode/iOS\ DeviceSupport:/iOSDeviceSupport
    privileged: true  # Required for device access
    environment:
      - FLUTTER_HOME=/usr/local/flutter
      - PATH=/usr/local/flutter/bin:$PATH
      - ANDROID_HOME=/usr/local/android-sdk
      # iOS development environment
      - DEVELOPER_DIR=/Xcode
      - XCODE_VERSION=latest
    working_dir: /src
    stdin_open: true
    tty: true

  ai:
    build:
      context: .
      dockerfile: apps/ai-pipeline/dockerfile
    container_name: buddy-ai
    ports:
      - "${AI_PORT}:${AI_CONTAINER_PORT}"
    volumes:
      - ./apps/ai-pipeline:/app
    command: python main.py
